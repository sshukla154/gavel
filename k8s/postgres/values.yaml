# Bitnami PostgreSQL Helm chart values for the Gavel kind cluster.
# Minimal single-replica setup — no HA, local dev only.
#
# Install:
#   helm repo add bitnami https://charts.bitnami.com/bitnami
#   helm upgrade --install postgres bitnami/postgresql \
#     -f k8s/postgres/values.yaml -n gavel --create-namespace

auth:
  # auth.database only provisions ONE database (hello_db, for auction-service).
  # bid-service's bids_db is created by the initdb script below instead — the
  # same mechanism infra/postgres/init.sql provides for docker-compose.
  database: hello_db
  username: postgres
  password: postgres
  postgresPassword: postgres

primary:
  persistence:
    size: 1Gi
  initdb:
    scripts:
      # Mirrors infra/postgres/init.sql (docker-compose's equivalent). Runs
      # once, only on a first-ever startup against an empty data volume.
      create-bids-db.sql: |
        CREATE DATABASE bids_db;

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi
