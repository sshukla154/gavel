replicaCount: 1

image:
  repository: ghcr.io/sshukla154/gavel/auction-service
  pullPolicy: IfNotPresent
  # Overridden by the CI update-helm-tag job on every push to shukla.
  tag: "sha-bc74687"

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

service:
  type: ClusterIP
  port: 8081

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

env:
  SPRING_PROFILES_ACTIVE: prod
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/gavel

# Datasource credentials — stored as a Kubernetes Secret.
secret:
  datasourceUrl: "jdbc:postgresql://postgres:5432/hello_db"
  datasourceUsername: "postgres"
  datasourcePassword: "postgres"

ingress:
  enabled: false
  className: ""
  host: auction-service.local
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # nginx.ingress.kubernetes.io/rewrite-target: /

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8081
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8081
  initialDelaySeconds: 20
  periodSeconds: 5
  failureThreshold: 3
