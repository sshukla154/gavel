name: gavel

services:

  postgres:
    container_name: gavel-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hello_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - gavel-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hello_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    container_name: gavel-otel-collector
    image: otel/opentelemetry-collector-contrib:0.127.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infra/otel-collector/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics exporter (scraped by Prometheus)
    networks:
      - gavel-net
    depends_on:
      - tempo
      - loki

  prometheus:
    container_name: gavel-prometheus
    image: prom/prometheus:v3.4.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./infra/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
    ports:
      - "9090:9090"
    networks:
      - gavel-net
    depends_on:
      - otel-collector

  tempo:
    container_name: gavel-tempo
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infra/tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"   # Tempo HTTP API
    networks:
      - gavel-net

  loki:
    container_name: gavel-loki
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./infra/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - gavel-net

  grafana:
    container_name: gavel-grafana
    image: grafana/grafana:12.0.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - gavel-net
    depends_on:
      - prometheus
      - tempo
      - loki

networks:
  gavel-net:
    driver: bridge

volumes:
  postgres-data:
  grafana-data:
  tempo-data:
  loki-data:
