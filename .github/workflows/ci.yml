name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# packages:write — push image to GHCR.
# contents:write — the update-helm-tag job commits the new SHA back to values.yaml.
permissions:
  contents: write
  packages: write

jobs:

  # ─── Job 1: compile, unit tests, integration tests ─────────────────────────
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven   # caches ~/.m2 between runs keyed on pom.xml hash

      # mvn verify runs:
      #   surefire  → *Test.java  (PingControllerTest — @SpringBootTest + Testcontainers)
      #   failsafe  → *IT.java    (VisitPersistenceIT — Testcontainers Postgres)
      # GitHub-hosted ubuntu-latest exposes the Docker socket, so Testcontainers
      # works with no additional configuration.
      - name: Run tests
        run: mvn -B verify

      # Preserve reports when a test fails so they can be downloaded from the
      # Actions run summary for diagnosis.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  # ─── Job 2: Docker build and GHCR push (one matrix leg per service) ─────────
  docker:
    name: Docker build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-and-test   # never publish an image from a failed build

    strategy:
      matrix:
        include:
          - service: auction-service
            dockerfile: ./Dockerfile
          - service: bid-service
            dockerfile: ./services/bid-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildx adds multi-platform support and the GHA layer cache backend.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only authenticate on push events — PRs from forks cannot access secrets.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Derive image tags and OCI labels from git metadata.
      # Tags produced (per service):
      #   push to master  → ghcr.io/sshukla154/gavel/<service>:master
      #                   → ghcr.io/sshukla154/gavel/<service>:sha-<short>
      #                   → ghcr.io/sshukla154/gavel/<service>:latest
      #   pull request    → ghcr.io/sshukla154/gavel/<service>:pr-<N>
      #                   → ghcr.io/sshukla154/gavel/<service>:sha-<short>
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/sshukla154/gavel/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      # Build the image using the repo-root Dockerfile.
      # cache-from/to: type=gha stores Docker layer cache in the GitHub Actions
      # cache store — subsequent builds reuse the deps and build stages and
      # typically complete in under 2 minutes.
      # push is false on PRs (image is built to validate the Dockerfile, not pushed).
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─── Job 3: Trivy — scan the pushed image for HIGH/CRITICAL CVEs ────────────
  # Runs only on push events (image must exist in GHCR before it can be scanned).
  # The job fails if any HIGH or CRITICAL vulnerability is found — the GitOps
  # tag-update job will not run, preventing a vulnerable image from being deployed.
  scan:
    name: Trivy vulnerability scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'

    strategy:
      matrix:
        service: [auction-service, bid-service]

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute short SHA
        id: short-sha
        run: echo "value=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/sshukla154/gavel/${{ matrix.service }}:sha-${{ steps.short-sha.outputs.value }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  # ─── Job 4: GitOps — write the new image SHA back to Helm values ────────────
  # auction-service only: bid-service has no Helm chart yet (tracked as Phase 2 debt).
  # Runs only on push to master (not on PRs, not on other branches).
  # ArgoCD detects the values.yaml change and rolls out the new image automatically.
  # [skip ci] in the commit message stops this push from re-triggering the workflow.
  update-helm-tag:
    name: Update Helm image tag
    runs-on: ubuntu-latest
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: master

      - name: Update image tag in values.yaml
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          sed -i "s/^  tag: .*/  tag: \"sha-${SHORT_SHA}\"/" helm/auction-service/values.yaml

      - name: Commit and push tag update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/auction-service/values.yaml
          git diff --staged --quiet || git commit -m "chore: bump auction-service image to sha-$(echo ${{ github.sha }} | cut -c1-7) [skip ci]"
          git push
