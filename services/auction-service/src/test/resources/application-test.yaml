# Test-profile overrides only — the main application.yaml still loads underneath.
# jwk-set-uri: lets the Spring Security context start without a real Keycloak
# (KeycloakAuthIT overrides via @DynamicPropertySource).
# listener.auto-startup false: Kafka listeners stay off unless a test re-enables them.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/mock-jwks
  kafka:
    listener:
      auto-startup: false
    # No topic creation at context startup: most tests have no broker, and the
    # KafkaAdmin retry loop against localhost:9092 floods the logs otherwise.
    # Kafka ITs rely on the Testcontainers broker's auto-topic-creation.
    admin:
      auto-create: false

gavel:
  auction:
    auto-close:
      # Off by default in tests: a live 5s sweep against every SpringBootTest's
      # Postgres container would be noisy and unnecessary — ITs that need it override
      # this property explicitly and call the scheduler bean directly.
      enabled: false
