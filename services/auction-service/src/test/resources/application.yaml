# Test-classpath override: point the JWT decoder at a non-existent URL so the
# Spring Security context loads without a real Keycloak instance. Tests that
# need real JWT validation (KeycloakAuthIT) override this via @DynamicPropertySource.
spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9999/mock-jwks
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      group-id: auction-service
      properties:
        spring.json.trusted.packages: "com.shukla.gavel.common.event"
    listener:
      auto-startup: false
